        /* =========================================
           GALAXIES
        ========================================= */

        .galaxy {
            position: absolute;

            width: 450px;
            height: 190px;

            border-radius: 50%;

            background:
                radial-gradient(
                    ellipse,
                    rgba(255, 255, 255, 0.9) 0%,
                    rgba(170, 130, 255, 0.55) 10%,
                    rgba(100, 60, 230, 0.25) 30%,
                    transparent 70%
                );

            filter: blur(7px);
            opacity: 0.45;

            pointer-events: none;
        }

        /* Each galaxy has a different movement pattern */

        .galaxy.one {
            top: 5%;
            left: -100px;
            transform: rotate(-25deg);

            animation: galaxyOne 45s ease-in-out infinite alternate;
        }

        .galaxy.two {
            right: -120px;
            top: 45%;
            transform: rotate(30deg);
            opacity: 0.35;

            animation: galaxyTwo 55s ease-in-out infinite alternate;
        }

        .galaxy.three {
            left: 35%;
            bottom: -100px;
            transform: rotate(-15deg);
            opacity: 0.3;

            animation: galaxyThree 65s ease-in-out infinite alternate;
        }

        .galaxy.four {
            left: 50%;
            top: 20%;
            transform: rotate(15deg);
            opacity: 0.25;

            animation: galaxyFour 70s ease-in-out infinite alternate;
        }

        @keyframes galaxyOne {
            0% {
                transform: translate(0px, 0px) rotate(-25deg);
            }

            50% {
                transform: translate(300px, 180px) rotate(-10deg);
            }

            100% {
                transform: translate(100px, 400px) rotate(10deg);
            }
        }

        @keyframes galaxyTwo {
            0% {
                transform: translate(0px, 0px) rotate(30deg);
            }

            50% {
                transform: translate(-300px, -150px) rotate(15deg);
            }

            100% {

            }

        @keyframes galaxyThree {

            }

            50% {

            }

        @keyframes galaxyFour {

        /* =========================================
           STARS
        ========================================= */
.star {
    position: fixed;

    background: white;
    border-radius: 50%;

    pointer-events: none;

    box-shadow:
        0 0 5px white,
        0 0 10px rgba(255,255,255,0.8);
}

function createStar() {

    const star = document.createElement("div");

    star.className = "star";

    /* -------------------------
       STAR POSITION
       ------------------------- */

    let x = Math.random() * window.innerWidth;
    let y = Math.random() * window.innerHeight;


    /* -------------------------
       STAR SIZE
       ------------------------- */

    const size = 1.5 + Math.random() * 5;

    star.style.width = size + "px";
    star.style.height = size + "px";


    /* -------------------------
       STAR BRIGHTNESS
       Bigger = brighter
       ------------------------- */

    const glow = size * 3;

    star.style.boxShadow = `
        0 0 ${glow}px white,
        0 0 ${glow * 2}px rgba(255,255,255,0.9),
        0 0 ${glow * 3}px rgba(255,255,255,0.4)
    `;

    star.style.opacity =
        0.4 + Math.random() * 0.6;


    /* -------------------------
       ADD STAR
       ------------------------- */

    document.body.appendChild(star);

    stars.push(star);


    /* -------------------------
       SPEED
       Bigger = faster
       ------------------------- */

    const speed =
        4 +
        size * 1.5 +
        Math.random() * 2;


    /* -------------------------
       MOVE STAR
       ------------------------- */

    function moveStar() {

        x += speed;


        /* If star leaves right side,
           bring it back on left */

        if (x > window.innerWidth + size) {

            x = -size;

            y = Math.random() * window.innerHeight;
        }


        star.style.left = x + "px";
        star.style.top = y + "px";


        requestAnimationFrame(moveStar);
    }


    moveStar();

    return star;
}

        /* Star explosion */

        .star.popping {
            opacity: 0;
            transform: scale(5);
        }

        /* =========================================
           STAR PARTICLES
        ========================================= */

        .star-particle {
            position: fixed;

            width: 3px;

            }

                transform:

                        var(--x),
                        var(--y)
                    )
                    scale(0);
            }
        }

    <!-- =========================================
         STAR SYSTEM
    ========================================= -->

    <script>

        const STAR_COUNT = 350;

        const stars = [];


        /* =====================================
           CREATE A STAR
        ===================================== */

        function createStar() {

            const star = document.createElement("div");

            star.className = "star";

            star.style.left =
                Math.random() * 100 + "vw";

            star.style.top =
                Math.random() * 100 + "vh";

            /* Random star size */

            const size =
                1.5 + Math.random() * 3;

            star.style.width =
                size + "px";

            star.style.height =
                size + "px";


            /* Random brightness */

            star.style.opacity =
                0.4 + Math.random() * 0.6;


            document.body.appendChild(star);

            stars.push(star);

            return star;
        }


        /* =====================================
           CREATE INITIAL STARS
        ===================================== */

        for (
            let i = 0;
            i < STAR_COUNT;
            i++
        ) {
            createStar();
        }


        /* =====================================
           GET MOUSE POSITION
        ===================================== */

        let mouseX = -1000;
        let mouseY = -1000;

        document.addEventListener(
            "mousemove",
            function(event) {

                mouseX = event.clientX;
                mouseY = event.clientY;

                checkStars();

            }
        );


        /* =====================================
           CHECK IF MOUSE TOUCHED A STAR
        ===================================== */

        function checkStars() {

            for (
                let i = stars.length - 1;
                i >= 0;
                i--
            ) {

                const star = stars[i];

                if (
                    star.classList.contains(
                        "popping"
                    )
                ) {
                    continue;
                }


                const rect =
                    star.getBoundingClientRect();

                const starX =
                    rect.left +
                    rect.width / 2;

                const starY =
                    rect.top +
                    rect.height / 2;


                const distance =
                    Math.sqrt(
                        Math.pow(
                            mouseX - starX,
                            2
                        )
                        +
                        Math.pow(
                            mouseY - starY,
                            2
                        )
                    );


                /* Mouse touched star */

                if (distance < 15) {

                    popStar(
                        star,
                        starX,
                        starY
                    );

                }

            }

        }


        /* =====================================
           POP STAR
        ===================================== */

        function popStar(
            star,
            x,
            y
        ) {

            star.classList.add(
                "popping"
            );


            /* Create explosion particles */

            for (
                let i = 0;
                i < 10;
                i++
            ) {

                const particle =
                    document.createElement(
                        "div"
                    );

                particle.className =
                    "star-particle";


                particle.style.left =
                    x + "px";

                particle.style.top =
                    y + "px";


                const angle =
                    Math.random() *
                    Math.PI * 2;

                const distance =
                    15 +
                    Math.random() * 35;


                particle.style.setProperty(
                    "--x",
                    Math.cos(angle) *
                    distance +
                    "px"
                );

                particle.style.setProperty(
                    "--y",
                    Math.sin(angle) *
                    distance +
                    "px"
                );


                document.body.appendChild(
                    particle
                );


                setTimeout(
                    function() {

                        particle.remove();

                    },
                    700
                );

            }


            /* Remove old star */

            setTimeout(
                function() {

                    const index =
                        stars.indexOf(star);

                    if (index !== -1) {
                        stars.splice(index, 1);
                    }

                    star.remove();


                    /* Create replacement star */

                    createStar();

                },
                400
            );

        }


    </script>
